<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se</title>
    <link rel="shortcut icon" href="/primeiro-bi/atividades/formulario-cadastro-html-css/images/user.ico">

    <link rel="stylesheet" href="https://cdn.linearicons.com/free/1.0.0/icon-font.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Formulário Web</h1>
    </header>

    <form>
        <fieldset>
            <legend>Crie sua conta</legend>
            
            <p class="nome">
                <label for="nome">Nome:</label>
                <input type="text" name="???" placeholder="Digite seu nome completo" id="nome" required>
            </p>
        </div>
            
            
            <p>
                <label for="email">E-mail:</label>
                <input type="email" name="??" placeholder="Digite seu endereço de e-mail" id="email" required>
            </p>
            <p>
                <label for="senha">Senha:</label>
                <input type="password" name="??" placeholder="Digite sua senha" id="password" minlength="8" required>
            </p> 
            <p>
                <strong>Gênero:</strong>
                <label>
                    <input type="radio" name="genero" value="masculino">
                    Masculino
                </label>
                
                <label>
                    <input type="radio" name="genero" value="feminino">
                    Feminino
                </label>
            </p>
            <p>
                <label for="biografia"></label>
                <textarea name="biografia" id="biografia" rows="8" placeholder="Escreva um pouco sobre você..."></textarea>
            </p>
            <p>
                <label for="termos">
                    <input type="checkbox" name="termos" id="termos" required>                
                    Li e concordo com os termos de uso
                </label>
            </p>
            <p>
                <button type="submit">Criar conta</button>
            </p>
        </fieldset>
    </form>
    
</body>
</html>
